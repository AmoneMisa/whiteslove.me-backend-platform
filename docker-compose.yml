name: whiteslove-backend-platform

# Deployment invariant: every deployable process has its own image/build
# context. Domain deploys select explicit service names and use --no-deps;
# changing one domain must not recreate unrelated APIs or workers.
services:
  freellmapi:
    # Pin the runtime code; FreeLLMAPI still refreshes its signed free-model
    # catalog independently, so provider/model data can stay current without a
    # surprise application-code upgrade during deploy.
    image: ${FREELLMAPI_IMAGE:-ghcr.io/tashfeenahmed/freellmapi:v0.9.0}
    labels:
      me.whiteslove.platform.domain: ai
      me.whiteslove.platform.role: gateway
    restart: unless-stopped
    init: true
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY:-}
      - FREEAPI_DB_PATH=/app/server/data/freellmapi.db
      # Existing ai-worker provider credentials are imported declaratively at
      # boot. They are persisted encrypted by FreeLLMAPI and never need to be
      # copied through its dashboard.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - LLM7_API_KEY=${LLM7_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_AUTH_TOKEN=${CLOUDFLARE_AUTH_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        export FREEAPI_CONFIG_JSON="$$(node - <<'NODE'
        const keys = [];
        const add = (platform, raw) => {
          const key = String(raw || '').trim();
          keys.push(key
            ? { platform, key, label: 'env', enabled: true }
            : { platform, key: 'disabled-by-env', label: 'env', enabled: false });
        };
        add('groq', process.env.GROQ_API_KEY);
        add('google', process.env.GEMINI_API_KEY);
        add('nvidia', process.env.NVIDIA_API_KEY);
        add('huggingface', process.env.HUGGINGFACE_API_KEY);
        add('llm7', process.env.LLM7_API_KEY);
        add('openrouter', process.env.OPENROUTER_API_KEY);
        add('mistral', process.env.MISTRAL_API_KEY);

        const cfAccount = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
        const cfToken = String(process.env.CLOUDFLARE_API_TOKEN || process.env.CLOUDFLARE_AUTH_TOKEN || '').trim();
        keys.push(cfAccount && cfToken
          ? { platform: 'cloudflare', key: cfAccount + ':' + cfToken, label: 'env', enabled: true }
          : { platform: 'cloudflare', key: 'disabled:disabled', label: 'env', enabled: false });

        // Zero-key safety net. Kilo is deliberately not auto-enabled because
        // its anonymous free route may log prompts/outputs for training.
        keys.push({ platform: 'ovh', label: 'keyless', enabled: true });
        keys.push({ platform: 'aihorde', label: 'keyless', enabled: true });

        process.stdout.write(JSON.stringify({
          keys,
          routing: { strategy: 'balanced', keySelectionStrategy: 'least-remaining' },
        }));
        NODE
        )"

        rm -f /app/server/data/unified.key
        node server/dist/index.js &
        server_pid=$$!
        terminate() {
          kill -TERM "$$server_pid" >/dev/null 2>&1 || true
          wait "$$server_pid" || true
        }
        trap terminate TERM INT

        exported=false
        attempt=0
        while [ "$$attempt" -lt 100 ]; do
          attempt=$$((attempt + 1))
          if ! kill -0 "$$server_pid" >/dev/null 2>&1; then
            wait "$$server_pid"
            exit $$?
          fi

          if (cd /app/server && node - <<'NODE'
        const fs = require('node:fs');
        const Database = require('better-sqlite3');
        const dbPath = process.env.FREEAPI_DB_PATH || '/app/server/data/freeapi.db';
        try {
          const db = new Database(dbPath, { readonly: true, fileMustExist: true });
          const row = db.prepare("SELECT value FROM settings WHERE key = 'unified_api_key' LIMIT 1").get();
          db.close();
          const key = String(row?.value || '').trim();
          if (!key) process.exit(1);
          fs.writeFileSync('/app/server/data/unified.key', key + '\n', { mode: 0o600 });
        } catch {
          process.exit(1);
        }
        NODE
          ); then
            exported=true
            break
          fi
          sleep 0.1
        done

        if [ "$$exported" != "true" ]; then
          echo "FreeLLMAPI started but its unified key could not be exported." >&2
          terminate
          exit 1
        fi

        wait "$$server_pid"
    volumes:
      - freellmapi-data:/app/server/data
    networks: [ platform ]
    ports:
      - "127.0.0.1:${FREELLMAPI_HOST_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: "${FREELLMAPI_MEMORY_LIMIT:-768m}"
    cpus: "${FREELLMAPI_CPUS:-0.5}"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/server/data/unified.key && node -e \"fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai-worker:
    build:
      context: ./apps/ai-worker
    image: ${AI_WORKER_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-ai-worker:latest}
    labels:
      me.whiteslove.platform.domain: ai
      me.whiteslove.platform.role: worker
    restart: unless-stopped
    init: true
    depends_on:
      freellmapi:
        condition: service_healthy
    environment:
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_TEXT_ENABLED=${AI_TEXT_ENABLED:-true}
      - AI_VISION_ENABLED=${AI_VISION_ENABLED:-true}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CONCURRENCY=${AI_CONCURRENCY:-1}
      - AI_QUEUE_MAX_PENDING=${AI_QUEUE_MAX_PENDING:-100}
      - AI_TEXT_TIMEOUT_MS=${AI_TEXT_TIMEOUT_MS:-120000}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-1}
      - AI_MIN_CONFIDENCE=${AI_MIN_CONFIDENCE:-0.6}
      - AI_MAX_TEXT_CHARS=${AI_MAX_TEXT_CHARS:-32000}
      - AI_MAX_PHOTOS_PER_LISTING=${AI_MAX_PHOTOS_PER_LISTING:-10}
      # Ceiling on a vision request that carries photos inline as base64
      # (cloudflare and gemini refuse remote image URLs). The nginx relay
      # in front of Gemini answers HTTP 413 above its own 1MB body limit,
      # so the default stays under it; raise both together.
      - AI_MAX_INLINE_REQUEST_BYTES=${AI_MAX_INLINE_REQUEST_BYTES:-900000}
      - TEXT_PROVIDERS=${TEXT_PROVIDERS:-freellmapi}
      - TRANSLATION_PROVIDERS=${TRANSLATION_PROVIDERS:-freellmapi}
      - FREE_TRANSLATOR_ENABLED=${FREE_TRANSLATOR_ENABLED:-true}
      - FREE_TRANSLATOR_MAX_BYTES=${FREE_TRANSLATOR_MAX_BYTES:-500}
      - FREE_TRANSLATOR_TIMEOUT_MS=${FREE_TRANSLATOR_TIMEOUT_MS:-8000}
      - VISION_PROVIDERS=${VISION_PROVIDERS:-freellmapi}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      # Production does not need FREELLMAPI_API_KEY. The router exports its
      # generated key before healthcheck and this service reads the shared file.
      - FREELLMAPI_API_KEY_FILE=/run/freellmapi/unified.key
      - FREELLMAPI_TEXT_MODEL=${FREELLMAPI_TEXT_MODEL:-auto:balanced}
      - FREELLMAPI_VISION_MODEL=${FREELLMAPI_VISION_MODEL:-auto:smart}
      # Direct-provider credentials for when TEXT_PROVIDERS/VISION_PROVIDERS
      # names them explicitly instead of routing through freellmapi. Without
      # these, ai-worker has no way to authenticate with any provider it is
      # configured to call directly, and every extraction/vision request fails.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      - GROQ_TEXT_MODEL=${GROQ_TEXT_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_VISION_MODEL=${NVIDIA_VISION_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - NVIDIA_TEXT_MODEL=${NVIDIA_TEXT_MODEL:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - HUGGINGFACE_VISION_MODEL=${HUGGINGFACE_VISION_MODEL:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      - HUGGINGFACE_TEXT_MODEL=${HUGGINGFACE_TEXT_MODEL:-}
      - LLM7_API_KEY=${LLM7_API_KEY:-}
      - LLM7_VISION_MODEL=${LLM7_VISION_MODEL:-gpt-5.4-mini}
      - LLM7_TEXT_MODEL=${LLM7_TEXT_MODEL:-gpt-oss}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-google/gemma-4-31b-it:free}
      - OPENROUTER_TEXT_MODEL=${OPENROUTER_TEXT_MODEL:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_VISION_MODEL=${MISTRAL_VISION_MODEL:-mistral-small-latest}
      - MISTRAL_TEXT_MODEL=${MISTRAL_TEXT_MODEL:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_AUTH_TOKEN=${CLOUDFLARE_AUTH_TOKEN:-}
      - CLOUDFLARE_VISION_MODEL=${CLOUDFLARE_VISION_MODEL:-@cf/meta/llama-3.2-11b-vision-instruct}
      - VISION_CONCURRENCY=${VISION_CONCURRENCY:-1}
      - VISION_PROVIDER_TIMEOUT_MS=${VISION_PROVIDER_TIMEOUT_MS:-30000}
      - VISION_COOLDOWN_MS=${VISION_COOLDOWN_MS:-300000}
      - VISION_CACHE_TTL_MS=${VISION_CACHE_TTL_MS:-2592000000}
      - PROMPT_VERSION=${PROMPT_VERSION:-2}
      - SCHEMA_VERSION=${SCHEMA_VERSION:-4}
      - AI_CACHE_MAX_ENTRIES=${AI_CACHE_MAX_ENTRIES:-2000}
      - AI_CACHE_TTL_MS=${AI_CACHE_TTL_MS:-86400000}
      - AI_TRANSLATION_CACHE_TTL_MS=${AI_TRANSLATION_CACHE_TTL_MS:-604800000}
    volumes:
      - freellmapi-data:/run/freellmapi:ro
    networks: [ platform ]
    ports:
      - "127.0.0.1:4030:4030"
    mem_limit: "${AI_WORKER_MEMORY_LIMIT:-1g}"
    cpus: "${AI_WORKER_CPUS:-0.5}"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4030/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  platform-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whiteslove}
      POSTGRES_USER: ${POSTGRES_USER:-whiteslove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - platform-postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [ platform ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform-elasticsearch:
    build:
      context: ./services/elasticsearch
    image: ${ELASTICSEARCH_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-elasticsearch:latest}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - platform-elasticsearch-data:/usr/share/elasticsearch/data
    networks: [ platform ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  flats-migrate:
    build: { context: ./apps/flats }
    image: ${FLATS_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-flats:latest}
    command: ["node", "src/migrate.js"]
    restart: "no"
    environment: &flats-database-environment
      PGHOST: platform-postgres
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whiteslove}
      POSTGRES_USER: ${POSTGRES_USER:-whiteslove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGOPTIONS: -c search_path=flats,public
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: flats
      me.whiteslove.platform.role: migration

  flats-api:
    build: { context: ./apps/flats }
    image: ${FLATS_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-flats:latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *flats-database-environment
      ELASTICSEARCH_URL: http://platform-elasticsearch:9200
      ELASTICSEARCH_INDEX: flat-listings-v1
      AI_WORKER_URL: http://ai-worker:4030
      OLX_FETCHER_URL: http://flats-olx-router:4021
      SOCIAL_FETCHER_URL: http://social-fetcher:4040
      PHOTO_CACHE_DIR: /var/cache/flat-photos
      VISION_PHOTO_BASE_URL: http://flats-api:4000
      PHOTO_CACHE_MAX_MB: ${PHOTO_CACHE_MAX_MB:-512}
    volumes:
      - flats-photo-cache:/var/cache/flat-photos
    depends_on:
      flats-migrate: { condition: service_completed_successfully }
    networks: [ platform ]
    ports:
      - "127.0.0.1:${FLATS_API_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      me.whiteslove.platform.domain: flats
      me.whiteslove.platform.role: api

  flats-worker:
    build: { context: ./apps/flats }
    image: ${FLATS_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-flats:latest}
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *flats-database-environment
      ELASTICSEARCH_URL: http://platform-elasticsearch:9200
      ELASTICSEARCH_INDEX: flat-listings-v1
      AI_WORKER_URL: http://ai-worker:4030
      OLX_FETCHER_URL: http://flats-olx-router:4021
      OLX_FETCHER_URL_0: http://flats-olx-fetcher:4020
      OLX_FETCHER_URL_1: http://flats-olx-fetcher-ua:4020
      SOCIAL_FETCHER_URL: http://social-fetcher:4040
      QUEUE_PROTOCOL_VERSION: ${FLATS_QUEUE_PROTOCOL_VERSION:-3}
      QUEUE_SHARDS: ${FLATS_QUEUE_SHARDS:-2}
      QUEUE_REFRESH_SECONDS: ${FLATS_QUEUE_REFRESH_SECONDS:-1800}
      QUEUE_POLL_SECONDS: ${FLATS_QUEUE_POLL_SECONDS:-1}
      QUEUE_MAX_ATTEMPTS: ${FLATS_QUEUE_MAX_ATTEMPTS:-5}
      QUEUE_TASK_LEASE_SECONDS: ${FLATS_QUEUE_TASK_LEASE_SECONDS:-300}
      VISION_PHOTO_BASE_URL: http://flats-api:4000
      PG_STATEMENT_TIMEOUT_MS: ${FLATS_WORKER_STATEMENT_TIMEOUT_MS:-120000}
    depends_on:
      flats-migrate: { condition: service_completed_successfully }
      flats-olx-router: { condition: service_healthy }
      social-fetcher: { condition: service_healthy }
    networks: [ platform ]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      me.whiteslove.platform.domain: flats
      me.whiteslove.platform.role: worker

  flats-olx-fetcher:
    build: { context: ./services/olx-fetcher }
    image: ${OLX_FETCHER_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-olx-fetcher:latest}
    restart: unless-stopped
    environment: &olx-environment
      OLX_TIMEOUT: ${OLX_TIMEOUT:-45}
      OLX_ATTEMPTS: ${OLX_ATTEMPTS:-1}
      OLX_LOOKBACK_DAYS: ${OLX_LOOKBACK_DAYS:-21}
    networks: [ platform ]
    healthcheck: &olx-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4020/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  flats-olx-fetcher-ua:
    build: { context: ./services/olx-fetcher }
    image: ${OLX_FETCHER_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-olx-fetcher:latest}
    restart: unless-stopped
    environment: *olx-environment
    networks: [ platform ]
    healthcheck: *olx-healthcheck

  flats-olx-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./services/olx-router/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      flats-olx-fetcher: { condition: service_healthy }
      flats-olx-fetcher-ua: { condition: service_healthy }
    networks: [ platform ]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4021/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  social-fetcher:
    build: { context: ./services/social-fetcher }
    image: ${SOCIAL_FETCHER_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-social-fetcher:latest}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      SOCIAL_MAX_ITEMS: ${SOCIAL_MAX_ITEMS:-100}
      SOCIAL_HTTP_TIMEOUT: ${SOCIAL_HTTP_TIMEOUT:-30}
      SOCIAL_BROWSER_TIMEOUT_MS: ${SOCIAL_BROWSER_TIMEOUT_MS:-45000}
      SOCIAL_BROWSER_CONCURRENCY: ${SOCIAL_BROWSER_CONCURRENCY:-1}
      SOCIAL_IMPERSONATE: ${SOCIAL_IMPERSONATE:-chrome124}
      FACEBOOK_COOKIES: ${FACEBOOK_COOKIES:-}
    shm_size: ${SOCIAL_SHM_SIZE:-256mb}
    networks: [ platform ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4040/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  job-browser-fetcher:
    build: { context: ./services/job-browser-fetcher }
    image: ${JOB_BROWSER_FETCHER_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-job-browser-fetcher:latest}
    restart: unless-stopped
    environment:
      JOB_BROWSER_IMPERSONATE: ${JOB_BROWSER_IMPERSONATE:-chrome124}
      JOB_BROWSER_TIMEOUT: ${JOB_BROWSER_TIMEOUT:-25}
      JOB_BROWSER_ATTEMPTS: ${JOB_BROWSER_ATTEMPTS:-2}
      JOB_BROWSER_RETRY_BACKOFF: ${JOB_BROWSER_RETRY_BACKOFF:-2}
      JOB_BROWSER_ALLOWED_HOSTS: ${JOB_BROWSER_ALLOWED_HOSTS:-flexjobs.com,wellfound.com,workingnomads.com,jobspresso.co,virtualvocations.com,skipthedrive.com}
    networks: [ platform ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4040/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      me.whiteslove.platform.domain: vacancies
      me.whiteslove.platform.role: transport

  workforce-queue-migrate:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${WORKFORCE_QUEUE_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-vacancies:latest}
    command: ["node", "--experimental-transform-types", "./scripts/migrate-database.ts"]
    restart: "no"
    environment:
      JOBS_QUEUE_MIGRATION_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      JOBS_QUEUE_DB_SCHEMA: queue
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: workforce-queue
      me.whiteslove.platform.role: migration

  vacancies-migrate:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${VACANCIES_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-vacancies:latest}
    command: ["node", "--experimental-transform-types", "./scripts/migrate-database.ts"]
    restart: "no"
    environment:
      JOBS_MIGRATION_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      JOBS_DB_SCHEMA: jobs
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: vacancies
      me.whiteslove.platform.role: migration

  cv-migrate:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${CV_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-cv:latest}
    command: ["node", "--experimental-transform-types", "./scripts/migrate-database.ts"]
    restart: "no"
    environment:
      HIRING_MIGRATION_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      HIRING_DB_SCHEMA: hiring
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: cv
      me.whiteslove.platform.role: migration

  vacancies-api:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${VACANCIES_API_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-vacancies:latest}
    command: ["node", "--experimental-transform-types", "--import", "./jobs-worker/alias-loader.mjs", "./api/vacancies.ts"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      WORKFORCE_API_DOMAIN: vacancies
      PORT: 4010
      JOBS_RUNTIME_ROLE: api
      JOBS_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      JOBS_DB_SCHEMA: jobs
      ELASTICSEARCH_URL: http://platform-elasticsearch:9200
      JOBS_ELASTICSEARCH_INDEX: job-listings-v1
      SITE_STATE_DIR: /var/app/state/workforce
    volumes:
      - workforce-state:/var/app/state
    depends_on:
      vacancies-migrate: { condition: service_completed_successfully }
    networks: [ platform ]
    ports:
      - "127.0.0.1:${VACANCIES_API_HOST_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      me.whiteslove.platform.domain: vacancies
      me.whiteslove.platform.role: api

  cv-api:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${CV_API_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-cv:latest}
    command: ["node", "--experimental-transform-types", "--import", "./jobs-worker/alias-loader.mjs", "./api/cv.ts"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      WORKFORCE_API_DOMAIN: cv
      PORT: 4011
      JOBS_RUNTIME_ROLE: api
      HIRING_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      HIRING_DB_SCHEMA: hiring
      ELASTICSEARCH_URL: http://platform-elasticsearch:9200
      HIRING_ELASTICSEARCH_INDEX: candidate-profiles-v3
      SITE_STATE_DIR: /var/app/state/workforce
    volumes:
      - workforce-state:/var/app/state
    depends_on:
      cv-migrate: { condition: service_completed_successfully }
    networks: [ platform ]
    ports:
      - "127.0.0.1:${CV_API_HOST_PORT:-4011}:4011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4011/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      me.whiteslove.platform.domain: cv
      me.whiteslove.platform.role: api

  vacancies-worker:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${VACANCIES_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-vacancies:latest}
    command: ["node", "--experimental-transform-types", "--import", "./jobs-worker/alias-loader.mjs", "--import", "./jobs-worker/workerHealthBootstrap.ts", "./jobs-worker/vacancies.ts"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment: &workforce-environment
      WORKFORCE_DOMAIN: vacancies
      JOBS_RUNTIME_ROLE: worker
      JOBS_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      JOBS_DB_SCHEMA: jobs
      HIRING_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      HIRING_DB_SCHEMA: hiring
      JOBS_QUEUE_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      JOBS_QUEUE_DB_SCHEMA: queue
      AI_WORKER_URL: http://ai-worker:4030
      ELASTICSEARCH_URL: http://platform-elasticsearch:9200
      JOBS_ELASTICSEARCH_INDEX: job-listings-v1
      JOB_BROWSER_FETCHER_URL: http://job-browser-fetcher:4040
      SOCIAL_FETCHER_URL: http://social-fetcher:4040
      SITE_STATE_DIR: /var/app/state/workforce
    volumes:
      - workforce-state:/var/app/state
    depends_on:
      vacancies-migrate: { condition: service_completed_successfully }
      workforce-queue-migrate: { condition: service_completed_successfully }
      job-browser-fetcher: { condition: service_healthy }
      social-fetcher: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: vacancies
      me.whiteslove.platform.role: worker

  cv-worker:
    build: { context: ./apps/workforce, dockerfile: jobs-worker/Dockerfile }
    image: ${CV_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-cv:latest}
    command: ["node", "--experimental-transform-types", "--import", "./jobs-worker/alias-loader.mjs", "--import", "./jobs-worker/workerHealthBootstrap.ts", "./jobs-worker/cv.ts"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *workforce-environment
      WORKFORCE_DOMAIN: cv
      JOBS_QUEUE_WORKER_ID: cv-worker
    volumes:
      - workforce-state:/var/app/state
    depends_on:
      cv-migrate: { condition: service_completed_successfully }
      workforce-queue-migrate: { condition: service_completed_successfully }
      job-browser-fetcher: { condition: service_healthy }
      social-fetcher: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: cv
      me.whiteslove.platform.role: worker

  subscriptions-migrate:
    build: { context: ./apps/subscription-bot }
    image: ${SUBSCRIPTION_BOT_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-subscription-bot:latest}
    command: ["node", "src/migrate.mjs"]
    restart: "no"
    environment: &subscriptions-environment
      SUBSCRIPTIONS_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://whiteslove:change-me@platform-postgres:5432/whiteslove}
      SUBSCRIPTIONS_DB_SCHEMA: ${SUBSCRIPTIONS_DB_SCHEMA:-subscriptions}
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [ platform ]
    labels:
      me.whiteslove.platform.domain: subscriptions
      me.whiteslove.platform.role: migration

  subscription-bot:
    build: { context: ./apps/subscription-bot }
    image: ${SUBSCRIPTION_BOT_IMAGE:-ghcr.io/amonemisa/whiteslove.me-backend-platform-subscription-bot:latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *subscriptions-environment
      TELEGRAM_SUBSCRIPTION_BOT_ENABLED: ${TELEGRAM_SUBSCRIPTION_BOT_ENABLED:-off}
      TELEGRAM_SUBSCRIPTION_BOT_TOKEN: ${TELEGRAM_SUBSCRIPTION_BOT_TOKEN:-}
      SITE_BASE_URL: ${SITE_INTERNAL_URL:-https://whiteslove.me}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-https://whiteslove.me}
      FLAT_API_URL: http://flats-api:4000
      SUBSCRIPTION_POLL_SECONDS: ${SUBSCRIPTION_POLL_SECONDS:-60}
      SUBSCRIPTION_MAX_NOTIFICATIONS_PER_SCAN: ${SUBSCRIPTION_MAX_NOTIFICATIONS_PER_SCAN:-10}
      SUBSCRIPTION_FETCH_TIMEOUT_MS: ${SUBSCRIPTION_FETCH_TIMEOUT_MS:-20000}
      TELEGRAM_LONG_POLL_SECONDS: ${TELEGRAM_LONG_POLL_SECONDS:-25}
      FLAT_REQUIRE_VERIFIED: ${FLAT_REQUIRE_VERIFIED:-on}
    depends_on:
      subscriptions-migrate: { condition: service_completed_successfully }
    networks: [ platform ]
    mem_limit: ${SUBSCRIPTION_BOT_MEMORY_LIMIT:-256m}
    cpus: ${SUBSCRIPTION_BOT_CPUS:-0.5}
    pids_limit: ${SUBSCRIPTION_BOT_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      me.whiteslove.platform.domain: subscriptions
      me.whiteslove.platform.role: worker

volumes:
  freellmapi-data:
  platform-postgres-data:
  platform-elasticsearch-data:
  flats-photo-cache:
  workforce-state:

networks:
  platform:
    name: whiteslove-backend-platform
