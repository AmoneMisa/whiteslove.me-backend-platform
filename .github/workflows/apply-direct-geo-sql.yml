name: Apply direct database geo filtering

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-direct-geo-sql.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flats/package-lock.json

      - name: Move geo membership into authoritative SQL builders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          general = 'apps/flats/src/infrastructure/search/postgres-search-core.js'
          replace_once(
              general,
              "import { pool } from '../database/pool.js';\n",
              "import { pool } from '../database/pool.js';\nimport {appendPostgresGeoFilters} from './postgres-geo-filter.js';\n",
          )
          replace_once(
              general,
              "  if (filters.city) where.push(`l.city = ${add(String(filters.city))}`);\n  if (filters.district) where.push(`LOWER(l.district) = ${add(String(filters.district).toLowerCase())}`);\n",
              "  if (filters.city) where.push(`l.city = ${add(String(filters.city))}`);\n  appendPostgresGeoFilters({where, filters, alias: 'l', add});\n",
          )
          replace_once(
              general,
              "  if (filters.metro) where.push(`LOWER(l.metro) = ${add(String(filters.metro).toLowerCase())}`);\n\n  if (filters.metroMaxM != null) where.push(`l.metro_distance_m <= ${add(Number(filters.metroMaxM))}`);\n\n",
              "",
          )

          fast = 'apps/flats/src/infrastructure/search/postgres-search-fast-core.js'
          replace_once(
              fast,
              "import {pool} from '../database/pool.js';\n",
              "import {pool} from '../database/pool.js';\nimport {appendPostgresGeoFilters} from './postgres-geo-filter.js';\n",
          )
          replace_once(
              fast,
              "  if (filters.metroMaxM != null) where.push(`m.metro_distance_m <= ${add(Number(filters.metroMaxM))}`);\n\n",
              "",
          )
          replace_once(
              fast,
              "  if (filters.city) where.push(`m.city = ${add(String(filters.city))}`);\n  if (filters.district) where.push(`LOWER(m.district) = ${add(String(filters.district).toLowerCase())}`);\n  if (filters.metro) where.push(`LOWER(m.metro) = ${add(String(filters.metro).toLowerCase())}`);\n\n",
              "  if (filters.city) where.push(`m.city = ${add(String(filters.city))}`);\n  appendPostgresGeoFilters({where, filters, alias: 'm', add});\n\n",
          )

          listing = 'apps/flats/src/routes/listing-routes.js'
          replace_once(
              listing,
              "import {applyPostgresGeoGate, withoutLegacyGeoFilters} from '../infrastructure/search/postgres-geo-gate.js';\n",
              "",
          )
          replace_once(
              listing,
              "  searchMatches = await applyPostgresGeoGate({\n    filters,\n    countries: codes,\n    searchMatches,\n  });\n  const databaseFilters = withoutLegacyGeoFilters(filters);\n\n",
              "",
          )
          p = Path(listing)
          text = p.read_text()
          count = text.count('filters: databaseFilters,')
          if count != 2:
              raise SystemExit(f'{listing}: expected two databaseFilters uses, found {count}')
          p.write_text(text.replace('filters: databaseFilters,', 'filters,'))

          mobile = 'apps/flats/src/routes/mobile-listing-routes.js'
          replace_once(
              mobile,
              "import {applyPostgresGeoGate, withoutLegacyGeoFilters} from '../infrastructure/search/postgres-geo-gate.js';\n",
              "",
          )
          replace_once(
              mobile,
              "      const searchMatches = await applyPostgresGeoGate({\n        filters,\n        countries: codes,\n        searchMatches: null,\n      });\n      const databaseFilters = withoutLegacyGeoFilters(filters);\n      const result = await searchPostgresListings({\n        filters: databaseFilters,\n        countries: codes,\n        rates: fxRates,\n        searchMatches,\n      });\n",
              "      const result = await searchPostgresListings({\n        filters,\n        countries: codes,\n        rates: fxRates,\n        searchMatches: null,\n      });\n",
          )

          gate = Path('apps/flats/src/infrastructure/search/postgres-geo-gate.js')
          if not gate.exists():
              raise SystemExit('postgres-geo-gate.js is already missing')
          gate.unlink()

          Path('apps/flats/test/geo-search-filter.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {parseListingFilters} from '../src/routes/listing-routes.js';
          import {__postgresGeoFilterTest} from '../src/infrastructure/search/postgres-geo-filter.js';
          import {buildSearchContext} from '../src/infrastructure/search/postgres-search-core.js';
          import {buildMemberWhere} from '../src/infrastructure/search/postgres-search-fast-core.js';
          import {canonicalListingFilters} from '../src/listing/listing-filter-canonical.js';
          import {searchCursorScope} from '../src/support/postgres-cursor-scope.js';

          function collector() {
            const params = [];
            return {
              params,
              add(value) {
                params.push(value);
                return `$${params.length}`;
              },
            };
          }

          function withResolvedGeometry(filters) {
            Object.defineProperty(filters, '_resolvedSearchGeometry', {
              enumerable: false,
              configurable: true,
              value: Object.freeze({
                country: 'UZ',
                city: 'Tashkent',
                district: {
                  id: 'district:chilanzar',
                  canonicalName: 'Chilanzar',
                  boundary: {
                    type: 'Polygon',
                    coordinates: [[[69, 41], [70, 41], [70, 42], [69, 42], [69, 41]]],
                  },
                },
                metros: Object.freeze([
                  {requested: 'Novza', canonicalName: 'Novza', center: {lat: 41.292, lng: 69.223}},
                  {requested: 'Chilonzor', canonicalName: 'Chilonzor', center: {lat: 41.275, lng: 69.204}},
                ]),
                unresolvedMetros: Object.freeze([]),
              }),
            });
            return filters;
          }

          test('listing filter parser preserves multi-metro union and directional arc', () => {
            const filters = parseListingFilters({
              metro: 'Novza, Chilonzor,Novza',
              metroMaxM: '800',
              metroArc: '340,20',
            });
            assert.deepEqual(filters.metros, ['Novza', 'Chilonzor']);
            assert.equal(filters.metro, 'Novza,Chilonzor');
            assert.equal(filters.metroMaxM, 800);
            assert.deepEqual(filters.metroArc, {from: 340, to: 20});
          });

          test('district boundary SQL uses polygon containment and subtracts GeoJSON holes', () => {
            const {params, add} = collector();
            const boundary = {
              type: 'Polygon',
              coordinates: [
                [[69, 41], [70, 41], [70, 42], [69, 42], [69, 41]],
                [[69.4, 41.4], [69.6, 41.4], [69.6, 41.6], [69.4, 41.6], [69.4, 41.4]],
              ],
            };
            const sql = __postgresGeoFilterTest.boundaryPredicate('l', boundary, add);
            assert.match(sql, /point\(l\.lng, l\.lat\) <@ \$1::polygon/);
            assert.match(sql, /NOT \(point\(l\.lng, l\.lat\) <@ \$2::polygon\)/);
            assert.equal(params.length, 2);
          });

          test('metro spatial SQL is selected-station Haversine plus wrap-safe bearing arc', () => {
            const {params, add} = collector();
            const sql = __postgresGeoFilterTest.stationSpatialPredicate(
              'l',
              {center: {lat: 41.3, lng: 69.2}},
              {metroMaxM: 750, metroArc: {from: 340, to: 20}},
              add,
            );
            assert.match(sql, /ACOS/);
            assert.match(sql, /ATAN2/);
            assert.match(sql, />=/);
            assert.match(sql, / OR /);
            assert.match(sql, /<=/);
            assert.ok(params.includes(750));
            assert.ok(params.includes(340));
            assert.ok(params.includes(20));
          });

          test('general listing count/page/map context applies geo predicates directly in SQL', () => {
            const filters = withResolvedGeometry({
              city: 'Tashkent',
              district: 'Chilanzar',
              metro: 'Novza,Chilonzor',
              metros: ['Novza', 'Chilonzor'],
              metroMaxM: 800,
              metroArc: {from: 340, to: 20},
            });
            const context = buildSearchContext({filters, countries: ['UZ'], rates: null, searchMatches: null});
            const sql = context.where.join('\n');
            assert.match(sql, /point\(l\.lng, l\.lat\)/);
            assert.match(sql, /ACOS/);
            assert.match(sql, /ATAN2/);
            assert.doesNotMatch(sql, /LOWER\(l\.district\) =/);
            assert.doesNotMatch(sql, /LOWER\(l\.metro\) =/);
          });

          test('canonical feed applies the same geo predicates before count and pagination', () => {
            const filters = withResolvedGeometry({
              city: 'Tashkent',
              district: 'Chilanzar',
              metro: 'Novza,Chilonzor',
              metros: ['Novza', 'Chilonzor'],
              metroMaxM: 800,
              metroArc: {from: 340, to: 20},
            });
            const context = buildMemberWhere({filters, countries: ['UZ'], maxAgeDays: 14, rates: null});
            const sql = context.where;
            assert.match(sql, /point\(m\.lng, m\.lat\)/);
            assert.match(sql, /ACOS/);
            assert.match(sql, /ATAN2/);
            assert.doesNotMatch(sql, /LOWER\(m\.district\) =/);
            assert.doesNotMatch(sql, /LOWER\(m\.metro\) =/);
          });

          test('resolved geometry survives canonical filter copies', () => {
            const filters = withResolvedGeometry({
              dealType: 'longRent',
              roomOnly: true,
              district: 'Chilanzar',
            });
            const canonical = canonicalListingFilters(filters);
            assert.equal(canonical.dealType, 'roomRent');
            assert.equal(canonical._resolvedSearchGeometry, filters._resolvedSearchGeometry);
          });

          test('cursor scope changes when geographic membership changes', () => {
            const base = {
              city: 'Tashkent',
              district: 'Chilanzar',
              metro: 'Novza',
              metros: ['Novza'],
              metroMaxM: 800,
              metroArc: {from: 340, to: 20},
              sort: 'newest',
            };
            const novza = searchCursorScope(base, ['UZ']);
            const chilonzor = searchCursorScope({...base, metro: 'Chilonzor', metros: ['Chilonzor']}, ['UZ']);
            const largerRadius = searchCursorScope({...base, metroMaxM: 1200}, ['UZ']);
            assert.notEqual(novza, chilonzor);
            assert.notEqual(novza, largerRadius);
          });
          '''.replace(/^          /gm, ''))
          PY

      - name: Verify flats backend
        working-directory: apps/flats
        env:
          GEO_CATALOG_DECRYPTION_KEY: ${{ secrets.GEO_CATALOG_DECRYPTION_KEY }}
        run: |
          npm ci
          npm test

      - name: Commit direct SQL geo ownership
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-direct-geo-sql.yml
          git add apps/flats/src apps/flats/test
          git commit -m 'refactor(flats): apply geo membership in authoritative SQL'
          git push origin HEAD:develop
