name: Apply direct database geo filtering v3

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-direct-geo-sql-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flats/package-lock.json

      - name: Move geo membership into authoritative SQL builders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          general = 'apps/flats/src/infrastructure/search/postgres-search-core.js'
          replace_once(
              general,
              "import { pool } from '../database/pool.js';\n",
              "import { pool } from '../database/pool.js';\nimport {appendPostgresGeoFilters} from './postgres-geo-filter.js';\n",
          )
          replace_once(
              general,
              "  if (filters.city) where.push(`l.city = ${add(String(filters.city))}`);\n  if (filters.district) where.push(`LOWER(l.district) = ${add(String(filters.district).toLowerCase())}`);\n",
              "  if (filters.city) where.push(`l.city = ${add(String(filters.city))}`);\n  appendPostgresGeoFilters({where, filters, alias: 'l', add});\n",
          )
          replace_once(
              general,
              "  if (filters.metro) where.push(`LOWER(l.metro) = ${add(String(filters.metro).toLowerCase())}`);\n\n  if (filters.metroMaxM != null) where.push(`l.metro_distance_m <= ${add(Number(filters.metroMaxM))}`);\n\n",
              "",
          )

          fast = 'apps/flats/src/infrastructure/search/postgres-search-fast-core.js'
          replace_once(
              fast,
              "import {pool} from '../database/pool.js';\n",
              "import {pool} from '../database/pool.js';\nimport {appendPostgresGeoFilters} from './postgres-geo-filter.js';\n",
          )
          replace_once(
              fast,
              "  if (filters.metroMaxM != null) where.push(`m.metro_distance_m <= ${add(Number(filters.metroMaxM))}`);\n\n",
              "",
          )
          replace_once(
              fast,
              "  if (filters.city) where.push(`m.city = ${add(String(filters.city))}`);\n  if (filters.district) where.push(`LOWER(m.district) = ${add(String(filters.district).toLowerCase())}`);\n  if (filters.metro) where.push(`LOWER(m.metro) = ${add(String(filters.metro).toLowerCase())}`);\n\n",
              "  if (filters.city) where.push(`m.city = ${add(String(filters.city))}`);\n  appendPostgresGeoFilters({where, filters, alias: 'm', add});\n\n",
          )

          listing = 'apps/flats/src/routes/listing-routes.js'
          replace_once(
              listing,
              "import {applyPostgresGeoGate, withoutLegacyGeoFilters} from '../infrastructure/search/postgres-geo-gate.js';\n",
              "",
          )
          replace_once(
              listing,
              "  searchMatches = await applyPostgresGeoGate({\n    filters,\n    countries: codes,\n    searchMatches,\n  });\n  const databaseFilters = withoutLegacyGeoFilters(filters);\n\n",
              "",
          )
          p = Path(listing)
          text = p.read_text()
          if text.count('filters: databaseFilters,') != 2:
              raise SystemExit(f'{listing}: unexpected databaseFilters call count')
          p.write_text(text.replace('filters: databaseFilters,', 'filters,'))

          mobile_route = 'apps/flats/src/routes/mobile-listing-routes.js'
          replace_once(
              mobile_route,
              "import {applyPostgresGeoGate, withoutLegacyGeoFilters} from '../infrastructure/search/postgres-geo-gate.js';\n",
              "",
          )
          replace_once(
              mobile_route,
              "      const searchMatches = await applyPostgresGeoGate({\n        filters,\n        countries: codes,\n        searchMatches: null,\n      });\n      const databaseFilters = withoutLegacyGeoFilters(filters);\n      const result = await searchPostgresListings({\n        filters: databaseFilters,\n        countries: codes,\n        rates: fxRates,\n        searchMatches,\n      });\n",
              "      const result = await searchPostgresListings({\n        filters,\n        countries: codes,\n        rates: fxRates,\n        searchMatches: null,\n      });\n",
          )

          scanner = 'apps/flats/src/mobile/mobile-subscription-scanner.js'
          replace_once(
              scanner,
              "import {applyPostgresGeoGate, withoutLegacyGeoFilters} from '../infrastructure/search/postgres-geo-gate.js';\n",
              "",
          )
          replace_once(
              scanner,
              "  const searchMatches = await applyPostgresGeoGate({filters, countries});\n  const result = await searchPostgresListings({filters: withoutLegacyGeoFilters(filters), countries, rates, searchMatches});\n",
              "  const result = await searchPostgresListings({filters, countries, rates, searchMatches: null});\n",
          )

          geo_test = 'apps/flats/test/geo-search-filter.test.js'
          replace_once(
              geo_test,
              "  assert.doesNotMatch(sql, /LOWER\\(l\\.district\\) =/);\n",
              "  assert.match(sql, /NOT \\(l\\.lat IS NOT NULL[\\s\\S]*LOWER\\(l\\.district\\) =/);\n",
          )
          replace_once(
              geo_test,
              "  assert.doesNotMatch(sql, /LOWER\\(m\\.district\\) =/);\n",
              "  assert.match(sql, /NOT \\(m\\.lat IS NOT NULL[\\s\\S]*LOWER\\(m\\.district\\) =/);\n",
          )

          perf_test = 'apps/flats/test/performance-hardening.test.js'
          replace_once(perf_test, "    'l.metro_distance_m',\n", "")
          replace_once(
              perf_test,
              "  assert.match(search, /FROM listing_location_terms term/u);\n",
              "  assert.match(search, /appendPostgresGeoFilters/u);\n  assert.match(search, /FROM listing_location_terms term/u);\n",
          )

          remaining = []
          for p in Path('apps/flats/src').rglob('*.js'):
              if 'postgres-geo-gate' in p.read_text():
                  remaining.append(str(p))
          if remaining:
              raise SystemExit(f'remaining postgres-geo-gate imports: {remaining}')

          gate = Path('apps/flats/src/infrastructure/search/postgres-geo-gate.js')
          if gate.exists(): gate.unlink()
          PY

      - name: Verify flats backend
        working-directory: apps/flats
        env:
          GEO_CATALOG_DECRYPTION_KEY: ${{ secrets.GEO_CATALOG_DECRYPTION_KEY }}
        run: |
          npm ci
          npm test

      - name: Commit direct SQL geo ownership
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-direct-geo-sql.yml .github/workflows/apply-direct-geo-sql-v2.yml .github/workflows/apply-direct-geo-sql-v3.yml
          git add apps/flats/src apps/flats/test
          git commit -m 'refactor(flats): apply geo membership in authoritative SQL'
          git push origin HEAD:develop
