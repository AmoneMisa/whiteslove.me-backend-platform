name: Refresh flats dependency lock

on:
  push:
    branches:
      - fix/flats-geo-fallback-confidence
    paths:
      - apps/flats/package.json
      - .github/workflows/refresh-flats-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flats-geo-fallback-confidence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flats/package-lock.json
      - name: Refresh lockfile
        working-directory: apps/flats
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/flats/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flats/package-lock.json
          git commit -m "Refresh flats dependency lock"
          git push origin HEAD:fix/flats-geo-fallback-confidence
