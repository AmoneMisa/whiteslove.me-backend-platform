name: Refresh flats geo lock

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-flats-geo-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve published geo-catalog 0.9.3
        working-directory: apps/flats
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund '@whiteslove/geo-catalog@^0.9.3'
      - name: Verify resolved version
        working-directory: apps/flats
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies['@whiteslove/geo-catalog'] !== '^0.9.3') {
            throw new Error(`package.json geo-catalog range is ${pkg.dependencies['@whiteslove/geo-catalog']}`);
          }
          if (lock.packages[''].dependencies['@whiteslove/geo-catalog'] !== '^0.9.3') {
            throw new Error(`lock root geo-catalog range is ${lock.packages[''].dependencies['@whiteslove/geo-catalog']}`);
          }
          if (lock.packages['node_modules/@whiteslove/geo-catalog']?.version !== '0.9.3') {
            throw new Error(`geo-catalog resolved to ${lock.packages['node_modules/@whiteslove/geo-catalog']?.version}`);
          }
          console.log('Resolved @whiteslove/geo-catalog 0.9.3');
          NODE
      - name: Commit dependency and regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/flats/package.json apps/flats/package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency and lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: update geo-catalog to 0.9.3'
          git push origin HEAD:develop
