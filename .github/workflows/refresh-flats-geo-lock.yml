name: Refresh flats geo lock

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore pristine lock baseline
        run: git show 16579a5b92c437766212aae9a048547ab3526602:apps/flats/package-lock.json > apps/flats/package-lock.json
      - name: Resolve published geo-catalog
        working-directory: apps/flats
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify resolved version
        working-directory: apps/flats
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages[''].dependencies['@whiteslove/geo-catalog'] !== '^0.9.2') {
            throw new Error('root geo-catalog range is not ^0.9.2');
          }
          if (lock.packages['node_modules/@whiteslove/geo-catalog']?.version !== '0.9.2') {
            throw new Error(`geo-catalog resolved to ${lock.packages['node_modules/@whiteslove/geo-catalog']?.version}`);
          }
          console.log('Resolved @whiteslove/geo-catalog 0.9.2');
          NODE
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/flats/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: regenerate geo-catalog 0.9.2 lockfile'
          git push origin HEAD:develop
