name: Publish images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      flats: ${{ steps.filter.outputs.flats }}
      social: ${{ steps.filter.outputs.social }}
      vacancies: ${{ steps.filter.outputs.vacancies }}
      cv: ${{ steps.filter.outputs.cv }}
      crawler_core: ${{ steps.filter.outputs.crawler_core }}
      workforce_shared: ${{ steps.filter.outputs.workforce_shared }}
      subscriptions: ${{ steps.filter.outputs.subscriptions }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai: ['apps/ai-worker/**']
            flats:
              - 'apps/flats/**'
              - 'services/olx-fetcher/**'
            social:
              - 'services/social-fetcher/**'
            vacancies:
              - 'apps/workforce/server/jobs/**'
              - 'apps/workforce/server/vacancies/**'
              - 'apps/workforce/server/routes/jobs-**'
              - 'apps/workforce/shared/jobs/**'
              - 'apps/workforce/shared/contracts/jobs.ts'
              - 'services/job-browser-fetcher/**'
            cv:
              - 'apps/workforce/server/hiring/**'
              - 'apps/workforce/server/routes/hiring-**'
              - 'apps/workforce/shared/hiring/**'
              - 'apps/workforce/shared/contracts/hiring.ts'
            crawler_core:
              - 'apps/workforce/packages/crawler-core/**'
            workforce_shared:
              - 'apps/workforce/api/**'
              - 'apps/workforce/jobs-worker/**'
              - 'apps/workforce/scripts/**'
              - 'apps/workforce/package*.json'
              - 'apps/workforce/server/utils/**'
              - 'apps/workforce/shared/*.ts'
              - 'apps/workforce/shared/http/**'
            subscriptions: ['apps/subscription-bot/**']
            infrastructure: ['services/elasticsearch/**']

  publish:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ai == 'true' ||
      needs.changes.outputs.flats == 'true' ||
      needs.changes.outputs.social == 'true' ||
      needs.changes.outputs.vacancies == 'true' ||
      needs.changes.outputs.cv == 'true' ||
      needs.changes.outputs.crawler_core == 'true' ||
      needs.changes.outputs.workforce_shared == 'true' ||
      needs.changes.outputs.subscriptions == 'true' ||
      needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-worker
            context: apps/ai-worker
            dockerfile: apps/ai-worker/Dockerfile
            enabled: ai
          - name: flats
            context: apps/flats
            dockerfile: apps/flats/Dockerfile
            enabled: flats
          - name: vacancies
            context: apps/workforce
            dockerfile: apps/workforce/jobs-worker/Dockerfile
            enabled: vacancies
          - name: cv
            context: apps/workforce
            dockerfile: apps/workforce/jobs-worker/Dockerfile
            enabled: cv
          - name: subscription-bot
            context: apps/subscription-bot
            dockerfile: apps/subscription-bot/Dockerfile
            enabled: subscriptions
          - name: olx-fetcher
            context: services/olx-fetcher
            dockerfile: services/olx-fetcher/Dockerfile
            enabled: flats
          - name: social-fetcher
            context: services/social-fetcher
            dockerfile: services/social-fetcher/Dockerfile
            enabled: social
          - name: job-browser-fetcher
            context: services/job-browser-fetcher
            dockerfile: services/job-browser-fetcher/Dockerfile
            enabled: vacancies
          - name: elasticsearch
            context: services/elasticsearch
            dockerfile: services/elasticsearch/Dockerfile
            enabled: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        if: |
          github.event_name == 'workflow_dispatch' ||
          (matrix.enabled == 'ai' && needs.changes.outputs.ai == 'true') ||
          (matrix.enabled == 'flats' && needs.changes.outputs.flats == 'true') ||
          (matrix.enabled == 'social' && needs.changes.outputs.social == 'true') ||
          (matrix.enabled == 'vacancies' && (needs.changes.outputs.vacancies == 'true' || needs.changes.outputs.crawler_core == 'true' || needs.changes.outputs.workforce_shared == 'true')) ||
          (matrix.enabled == 'cv' && (needs.changes.outputs.cv == 'true' || needs.changes.outputs.workforce_shared == 'true')) ||
          (matrix.enabled == 'subscriptions' && needs.changes.outputs.subscriptions == 'true') ||
          (matrix.enabled == 'infrastructure' && needs.changes.outputs.infrastructure == 'true')
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/amonemisa/whiteslove.me-backend-platform-${{ matrix.name }}:latest
            ghcr.io/amonemisa/whiteslove.me-backend-platform-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [changes, publish]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.ai == 'true' ||
        needs.changes.outputs.flats == 'true' ||
        needs.changes.outputs.social == 'true' ||
        needs.changes.outputs.vacancies == 'true' ||
        needs.changes.outputs.cv == 'true' ||
        needs.changes.outputs.crawler_core == 'true' ||
        needs.changes.outputs.workforce_shared == 'true' ||
        needs.changes.outputs.subscriptions == 'true' ||
        needs.changes.outputs.infrastructure == 'true'
      )
    runs-on: ubuntu-latest
    environment: Production
    steps:
      # Recreates every container whose image just changed, keyed off the same
      # path filters that gate the publish matrix above. A domain's migration
      # service is included alongside its api/worker so schema changes land
      # before the process that depends on them starts.
      - name: Determine services to redeploy
        id: services
        run: |
          services=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            services+=(flats-migrate flats-api flats-worker flats-olx-fetcher flats-olx-fetcher-ua ai-worker social-fetcher workforce-queue-migrate vacancies-migrate vacancies-api vacancies-worker cv-migrate cv-api cv-worker subscriptions-migrate subscription-bot platform-elasticsearch)
          else
            [[ "${{ needs.changes.outputs.ai }}" == "true" ]] && services+=(ai-worker)
            [[ "${{ needs.changes.outputs.flats }}" == "true" ]] && services+=(flats-migrate flats-api flats-worker flats-olx-fetcher flats-olx-fetcher-ua)
            [[ "${{ needs.changes.outputs.social }}" == "true" ]] && services+=(social-fetcher)
            if [[ "${{ needs.changes.outputs.vacancies }}" == "true" || "${{ needs.changes.outputs.crawler_core }}" == "true" || "${{ needs.changes.outputs.workforce_shared }}" == "true" ]]; then
              services+=(workforce-queue-migrate vacancies-migrate vacancies-api vacancies-worker)
            fi
            if [[ "${{ needs.changes.outputs.cv }}" == "true" || "${{ needs.changes.outputs.workforce_shared }}" == "true" ]]; then
              services+=(workforce-queue-migrate cv-migrate cv-api cv-worker)
            fi
            [[ "${{ needs.changes.outputs.subscriptions }}" == "true" ]] && services+=(subscriptions-migrate subscription-bot)
            [[ "${{ needs.changes.outputs.infrastructure }}" == "true" ]] && services+=(platform-elasticsearch)
          fi
          unique=($(printf '%s\n' "${services[@]}" | awk '!seen[$0]++'))
          echo "list=${unique[*]}" >> "$GITHUB_OUTPUT"
      - name: Deploy via SSH
        if: steps.services.outputs.list != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/backend
            git fetch --quiet origin master
            git reset --quiet --hard origin/master
            ./deploy.sh ${{ steps.services.outputs.list }}
