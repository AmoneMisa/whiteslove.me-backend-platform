worker_processes 1;

events {
  worker_connections 256;
}

http {
  # Docker's embedded DNS. Needed because proxy_pass uses a variable upstream.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $arg_country $olx_upstream {
    default flat-finder-olx-fetcher:4020;
    UA      flat-finder-olx-fetcher-ua:4020;
  }

  server {
    listen 4021;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"ok":true}';
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      # A curl_cffi page can occasionally take >25s. Give the upstream enough
      # room to finish its own 45s timeout and return a useful 502 on failure.
      proxy_connect_timeout 5s;
      proxy_send_timeout 55s;
      proxy_read_timeout 55s;

      proxy_pass http://$olx_upstream$request_uri;
    }
  }
}
